# Publishes the site to GitHub Pages, with the latest firmware release bundled for the browser installer
# (Web Serial needs the image on the same origin as the page). Runs on push, by hand, and daily to pick
# up new firmware releases.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Bundle the latest firmware release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p firmware
          tag=$(gh release view -R halcyonframe/halcyonframe --json tagName -q .tagName 2>/dev/null || true)
          if [ -z "$tag" ]; then echo "no firmware release yet; the installer says so"; exit 0; fi
          gh release download "$tag" -R halcyonframe/halcyonframe -p halcyonframe-full.bin -D firmware
          # ESP Web Tools manifest: the full image (bootloader, partitions, app) at offset 0. Erasing first
          # clears the factory firmware's leftovers.
          cat > firmware/manifest.json <<JSON
          {
            "name": "Halcyon Frame",
            "version": "${tag}",
            "new_install_prompt_erase": true,
            "builds": [{ "chipFamily": "ESP32-S3", "parts": [{ "path": "halcyonframe-full.bin", "offset": 0 }] }]
          }
          JSON
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
